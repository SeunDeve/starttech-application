name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ['backend/**']

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: starttech-backend
  EKS_CLUSTER_NAME: starttech-cluster

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/MuchToDo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/MuchToDo/go.sum

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

  build-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        working-directory: backend/MuchToDo
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE=$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          LATEST=$REGISTRY/${{ env.ECR_REPOSITORY }}:latest

          docker build -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Built: $IMAGE"

      - name: Scan image
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ steps.build.outputs.image }}
        continue-on-error: true

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Update manifest and deploy
        run: |
          sed -i "s|image: .*starttech-backend.*|image: ${{ needs.build-push.outputs.image }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Verify rollout
        run: kubectl rollout status deployment/backend-api --timeout=5m